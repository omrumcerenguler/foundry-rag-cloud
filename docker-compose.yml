services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: foundry-rag-api:phase4
    environment:
      RAG_MODE: ${RAG_MODE:-LOCAL}
      RAG_DATABASE_PATH: ${DB_PATH:-/app/data/rag.db}
      API_KEY: ${API_KEY:?API_KEY must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      AZURE_CHAT_DEPLOYMENT: ${AZURE_CHAT_DEPLOYMENT:-gpt-4.1-mini}
      AZURE_EMBEDDING_DIMENSION: ${AZURE_EMBEDDING_DIMENSION:-1536}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-qwen3-embedding-0.6b}
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-Phi-3.5-mini}
      FOUNDRY_MODEL_PATH: ${FOUNDRY_MODEL_PATH:-/app/models}
    volumes:
      - rag_data:/app/data
      - ${FOUNDRY_MODEL_HOST_PATH:-./models}:/app/models:ro
    ports:
      - "${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        - CMD
        - python
        - /usr/local/bin/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foundry-rag-api:phase4
    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    environment:
      RAG_MODE: ${RAG_MODE:-LOCAL}
      RAG_DATABASE_PATH: ${DB_PATH:-/app/data/rag.db}
      API_KEY: ${API_KEY:?API_KEY must be set}
      RAG_API_URL: ${RAG_API_URL:-http://api:8000}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      FOUNDRY_MODEL_PATH: ${FOUNDRY_MODEL_PATH:-/app/models}
    volumes:
      - rag_data:/app/data
      - ${FOUNDRY_MODEL_HOST_PATH:-./models}:/app/models:ro
    ports:
      - "${APP_PORT:-8501}:8501"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  rag_data:
    name: foundry-rag-data
