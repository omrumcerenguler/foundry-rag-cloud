name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q api.py app.py config.py core factory.py ingestion.py evaluate.py main.py providers stores export_openapi.py healthcheck.py tests
      - name: Ruff
        run: ruff check .
      - name: Flake8
        run: flake8 . --exclude=.venv,.git,__pycache__
      - name: MyPy
        run: mypy --strict api.py app.py config.py core factory.py ingestion.py evaluate.py main.py providers stores export_openapi.py healthcheck.py --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=api --cov=config --cov=core --cov=stores --cov=ingestion --cov=providers --cov-report=term-missing --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install security tools
        run: python -m pip install --upgrade pip bandit pip-audit -r requirements.txt
      - name: Bandit Security Scan
        run: bandit -r api.py app.py config.py core factory.py ingestion.py evaluate.py main.py providers stores export_openapi.py healthcheck.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag foundry-rag:${{ github.sha }} .
      - name: Validate non-root image
        run: test "$(docker run --rm --entrypoint id foundry-rag:${{ github.sha }} -u)" = "10001"
      - name: Start container
        run: docker run --detach --name foundry-rag-ci -p 8000:8000 -e API_KEY=ci-secret -e RAG_MODE=LOCAL -e RAG_DATABASE_PATH=/app/data/rag.db foundry-rag:${{ github.sha }}
      - name: Wait for healthcheck
        run: |
          for attempt in $(seq 1 30); do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$status_code" = "503" ]; then exit 0; fi
            sleep 2
          done
          docker logs foundry-rag-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force foundry-rag-ci
